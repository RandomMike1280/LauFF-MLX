[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lauff"
version = "0.1.0"
description = "Lau garden bridge to a MaleCNS feeding-circuit experiment"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
lauff = "lauff.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lauff = ["web/*.html", "web/*.js", "web/*.npz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
